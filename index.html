<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="Víctor Hugo Peñas">
  <meta property="og:description" content="Lic. en Geografía (UNS) y developer. Mapas, software, juegos y música.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vitipe.github.io/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141414'/%3E%3Ctext x='16' y='22.5' font-family='monospace' font-size='20' font-weight='700' text-anchor='middle' fill='%23e8e4da'%3Ev%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ea;
      --fg: #1a1a1a;
      --muted: #7a766d;
      --accent: #b4532a;
      --rule: #dcd7cb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #e8e4da;
        --muted: #8a867d;
        --accent: #e8875a;
        --rule: #2a2a2a;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 15px;
      line-height: 1.7;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      padding: 48px 16px;
    }

    main {
      width: 100%;
      max-width: 38rem;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-transform: lowercase;
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.1em;
      margin-left: 0.15em;
      vertical-align: -0.15em;
      background: var(--accent);
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

    .bio {
      margin-top: 0.75rem;
      color: var(--muted);
    }

    hr {
      border: 0;
      border-top: 1px solid var(--rule);
      margin: 2.5rem 0;
    }

    ul { list-style: none; }

    li {
      display: grid;
      grid-template-columns: 2ch 10ch 1fr;
      align-items: baseline;
    }
    li + li { margin-top: 0.35rem; }

    .arrow, .label { color: var(--muted); }

    a {
      color: var(--fg);
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    a:hover, a:focus-visible {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 0.25em;
    }
    a:focus-visible { outline: 1px dashed var(--accent); outline-offset: 3px; }

    footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Víctor Hugo Peñas<span class="cursor" aria-hidden="true"></span></h1>
    <p class="bio">
      lic. en geografía (UNS) · developer<br>
      mapas, software, juegos y música
    </p>

    <hr>

    <ul>
      <li><span class="arrow">→</span><span class="label">mapas</span><a href="https://vitipe.github.io/proyectos-geo/">vitipe.github.io/proyectos-geo</a></li>
      <li><span class="arrow">→</span><span class="label">nodoagro</span><a href="https://www.nodoagro.com.ar/" target="_blank" rel="noopener">nodoagro.com.ar</a></li>
      <li><span class="arrow">→</span><span class="label">github</span><a href="https://github.com/vitipe" target="_blank" rel="noopener">github.com/vitipe</a></li>
      <li><span class="arrow">→</span><span class="label">linkedin</span><a href="https://www.linkedin.com/in/victor-hugo-pe%C3%B1as/" target="_blank" rel="noopener">in/victor-hugo-peñas</a></li>
      <li><span class="arrow">→</span><span class="label">email</span><a href="mailto:victorhpenas@gmail.com">victorhpenas@gmail.com</a></li>
    </ul>

    <footer>© 2026</footer>
  </main>
</body>
</html>
